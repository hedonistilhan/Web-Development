<!DOCTYPE html>
<html>
    <head>
        <title>The JavaScript String() Method</title>
    </head>
    <Body>
            The JavaScript String() Method</h1>
        </H1>
        <p> The JavaScript String() method converts a value to a string.</p>
        <p id="number_result"></p>
        <p id="string_result"></p>
        <script>
            var x = 70;
            var y = 90;
            document.getElementById("number_result").innerHTML = x + y
              document.getElementById("string_result").innerHTML = String(x) + String(y);
              let text= "I like cats";
              let result = text.replace("cats" , "dogs");
document.write("The replaced string is :" + result + "<br>");
let text1 = " I love cats. Cats are very easy to love. Cats are very popular.";
let result1 = text1.search("Cats");
document.write("The index of the first match is :" + result1 + "<br>");
        </script>

    </Body>
</html>
